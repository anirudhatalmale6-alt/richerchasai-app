name: Build RiCherChasAI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: richerchasai-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: richerchasai-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Create IPA archive
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r /tmp/RiCherChasAI.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: richerchasai-ios-ipa
          path: /tmp/RiCherChasAI.ipa
          retention-days: 30

  create-release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: richerchasai-android-apk
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: richerchasai-android-aab
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: richerchasai-ios-ipa
          path: artifacts/

      - name: Rename artifacts
        run: |
          VERSION="${{ github.event.inputs.version }}"
          mv artifacts/app-release.apk "artifacts/RiCherChasAI-${VERSION}-Android.apk" 2>/dev/null || true
          mv artifacts/app-release.aab "artifacts/RiCherChasAI-${VERSION}-Android.aab" 2>/dev/null || true
          mv artifacts/RiCherChasAI.ipa "artifacts/RiCherChasAI-${VERSION}-iOS.ipa" 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: RiCherChasAI v${{ github.event.inputs.version }}
          body: |
            RiCherChasAI Voice Recorder v${{ github.event.inputs.version }}

            - Professional voice recording (WAV/MP3)
            - On-device AI noise removal
            - Auphonic cloud AI enhancement
            - Dark Electric Pulse theme
          files: artifacts/*
